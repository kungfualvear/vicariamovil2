<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViCaRiA · Atuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#E3E7DC;
    --surface:#FBFBF6;
    --ink:#1E2A28;
    --ink-soft:#5B6864;
    --line:#C9CFC0;
    --caudal:#2B6E82;
    --caudal-soft:#DCEAEC;
    --altura:#B8792F;
    --altura-soft:#F3E6D2;
    --focus:#2B6E82;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:22px 20px 14px;
    max-width:760px;
    margin:0 auto;
  }
  .brand{
    font-size:1.15rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .brand span{ color:var(--ink-soft); font-weight:400; }
  .actualizado{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-soft);
    text-align:right;
  }
  .actualizado b{ color:var(--ink); font-weight:600; }

  .grid{
    max-width:760px;
    margin:0 auto;
    padding:6px 16px 20px;
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
  }
  @media(min-width:620px){
    .grid{ grid-template-columns:1fr 1fr; }
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--caudal);
    border-radius:3px;
    padding:14px 16px;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .card-nombre{
    font-weight:600;
    font-size:0.98rem;
  }
  .icono-btn{
    background:none;
    border:1px solid var(--line);
    border-radius:50%;
    width:32px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--caudal);
    cursor:pointer;
    flex-shrink:0;
  }
  .icono-btn:hover, .icono-btn:focus-visible{
    border-color:var(--caudal);
    background:var(--caudal-soft);
  }
  .icono-btn:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .lecturas{
    display:flex;
    gap:22px;
  }
  .lectura-label{
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .lectura-valor{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.32rem;
    font-weight:600;
  }
  .lectura-valor.caudal{ color:var(--caudal); }
  .lectura-valor.altura{ color:var(--altura); }
  .lectura-unidad{
    font-size:0.68rem;
    font-weight:400;
    color:var(--ink-soft);
    margin-left:2px;
  }
  .lectura-valor.vacio{ color:var(--ink-soft); }

  .mensaje{
    max-width:760px;
    margin:40px auto;
    padding:0 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:0.92rem;
  }

  .modal{
    position:fixed; inset:0;
    background:rgba(20,28,26,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal[hidden]{ display:none; }
  .modal-panel{
    background:var(--surface);
    width:100%;
    max-width:640px;
    border-radius:14px 14px 0 0;
    padding:20px 20px 26px;
    animation:subir 0.18s ease-out;
  }
  @media(min-width:640px){
    .modal{ align-items:center; }
    .modal-panel{ border-radius:8px; }
  }
  @keyframes subir{
    from{ transform:translateY(24px); opacity:0; }
    to{ transform:translateY(0); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .modal-panel{ animation:none; }
  }
  .modal-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:2px;
  }
  .modal-titulo{ font-size:1.1rem; font-weight:600; }
  .modal-sub{ font-size:0.8rem; color:var(--ink-soft); margin:2px 0 14px; }
  .modal-cerrar{
    background:none; border:none;
    font-size:1.3rem; line-height:1;
    color:var(--ink-soft);
    cursor:pointer;
    padding:2px 4px;
  }
  .modal-cerrar:focus-visible{ outline:2px solid var(--focus); }
  .leyenda{
    display:flex; gap:16px;
    font-size:0.76rem;
    color:var(--ink-soft);
    margin-top:10px;
  }
  .leyenda span{ display:inline-flex; align-items:center; gap:6px; }
  .punto{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  .tabla-wrap{
    margin-top:16px;
    max-height:260px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:6px;
  }
  table.tabla-historico{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem;
  }
  .tabla-historico thead th{
    position:sticky; top:0;
    background:var(--surface);
    text-align:right;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:0.72rem;
    color:var(--ink-soft);
    padding:8px 12px;
    border-bottom:1px solid var(--line);
  }
  .tabla-historico th:first-child, .tabla-historico td:first-child{ text-align:left; }
  .tabla-historico td{
    text-align:right;
    padding:6px 12px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  .tabla-historico tbody tr:last-child td{ border-bottom:none; }
  .tabla-historico td.vacio{ color:var(--ink-soft); }

  .foot{
    max-width:760px;
    margin:26px auto 0;
    padding:0 20px;
    font-size:0.74rem;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">ViCaRiA <span>· Atuel</span></div>
  <div class="actualizado" id="actualizado">Cargando…</div>
</header>

<main class="grid" id="grid">
  <p class="mensaje">Cargando datos del Atuel…</p>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-panel">
    <div class="modal-head">
      <div>
        <div class="modal-titulo" id="modalTitulo">—</div>
        <div class="modal-sub">Últimas 3 horas</div>
      </div>
      <button class="modal-cerrar" id="modalCerrar" aria-label="Cerrar">✕</button>
    </div>
    <canvas id="modalChart" height="230"></canvas>
    <div class="leyenda">
      <span><i class="punto" style="background:#2B6E82"></i>Caudal (l/s)</span>
      <span><i class="punto" style="background:#B8792F"></i>Altura (cm)</span>
    </div>
    <div class="tabla-wrap">
      <table class="tabla-historico">
        <thead>
          <tr><th>Hora</th><th>Caudal (l/s)</th><th>Altura (cm)</th></tr>
        </thead>
        <tbody id="modalTablaBody"></tbody>
      </table>
    </div>
  </div>
</div>

<p class="foot">Fuente: Departamento General de Irrigación de Mendoza (telemetría MIDO).</p>

<script>
const CONFIG = {
  // Pegá acá la URL que termina en /exec de tu implementación de Apps Script
  URL_SCRIPT: 'PEGA_ACA_TU_URL_DE_APPS_SCRIPT',
  REFRESCAR_CADA_MS: 5 * 60 * 1000
};

let ultimosDatos = { encabezados: [], filas: [] };
let estaciones = [];
let chartModal = null;

const iconoHidrograma = `
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 15c3-7 5-7 8 0s5 7 8 0"/>
    <circle cx="18.4" cy="15" r="1.3" fill="currentColor" stroke="none"/>
  </svg>`;

function parseEstaciones(encabezados) {
  const lista = [];
  for (let i = 1; i < encabezados.length; i += 2) {
    const nombre = String(encabezados[i]).replace(/ - Caudal.*$/i, '');
    lista.push({ nombre, colCaudal: i, colAltura: i + 1 });
  }
  return lista;
}

function formatearNumero(valor) {
  if (valor === '' || valor === null || valor === undefined) return null;
  const n = Number(valor);
  if (Number.isNaN(n)) return null;
  return n.toLocaleString('es-AR', { maximumFractionDigits: 1 });
}

function formatearHora(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

function renderTarjetas() {
  const grid = document.getElementById('grid');
  const ultimaFila = ultimosDatos.filas[ultimosDatos.filas.length - 1];

  if (!ultimaFila) {
    grid.innerHTML = '<p class="mensaje">Todavía no hay datos registrados en la planilla.</p>';
    return;
  }

  document.getElementById('actualizado').innerHTML =
    'Actualizado <b>' + formatearHora(ultimaFila[0]) + '</b>';

  grid.innerHTML = estaciones.map(function (est, idx) {
    const caudal = formatearNumero(ultimaFila[est.colCaudal]);
    const altura = formatearNumero(ultimaFila[est.colAltura]);
    return (
      '<div class="card">' +
        '<div class="card-head">' +
          '<div class="card-nombre">' + est.nombre + '</div>' +
          '<button class="icono-btn" data-idx="' + idx + '" aria-label="Ver últimas 3 horas de ' + est.nombre + '">' + iconoHidrograma + '</button>' +
        '</div>' +
        '<div class="lecturas">' +
          '<div>' +
            '<div class="lectura-label">Caudal</div>' +
            '<div class="lectura-valor caudal' + (caudal === null ? ' vacio' : '') + '">' +
              (caudal === null ? 'Sin dato' : caudal + '<span class="lectura-unidad">l/s</span>') +
            '</div>' +
          '</div>' +
          '<div>' +
            '<div class="lectura-label">Altura</div>' +
            '<div class="lectura-valor altura' + (altura === null ? ' vacio' : '') + '">' +
              (altura === null ? 'Sin dato' : altura + '<span class="lectura-unidad">cm</span>') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  grid.querySelectorAll('.icono-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      abrirModal(estaciones[Number(btn.dataset.idx)]);
    });
  });
}

function abrirModal(est) {
  document.getElementById('modalTitulo').textContent = est.nombre;
  document.getElementById('modal').hidden = false;

  const etiquetas = ultimosDatos.filas.map(function (f) { return formatearHora(f[0]); });
  const caudales = ultimosDatos.filas.map(function (f) { return f[est.colCaudal] === '' ? null : Number(f[est.colCaudal]); });
  const alturas  = ultimosDatos.filas.map(function (f) { return f[est.colAltura] === '' ? null : Number(f[est.colAltura]); });

  if (chartModal) chartModal.destroy();
  const ctx = document.getElementById('modalChart').getContext('2d');
  chartModal = new Chart(ctx, {
    type: 'line',
    data: {
      labels: etiquetas,
      datasets: [
        {
          label: 'Caudal (l/s)', data: caudales, yAxisID: 'yCaudal',
          borderColor: '#2B6E82', backgroundColor: '#2B6E82', tension: 0.25, pointRadius: 2, spanGaps: true
        },
        {
          label: 'Altura (cm)', data: alturas, yAxisID: 'yAltura',
          borderColor: '#B8792F', backgroundColor: '#B8792F', tension: 0.25, pointRadius: 2, spanGaps: true
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        yCaudal: { position: 'left', title: { display: true, text: 'l/s' } },
        yAltura: { position: 'right', title: { display: true, text: 'cm' }, grid: { drawOnChartArea: false } }
      }
    }
  });

  const filasTabla = ultimosDatos.filas.slice().reverse();
  document.getElementById('modalTablaBody').innerHTML = filasTabla.map(function (f) {
    const c = formatearNumero(f[est.colCaudal]);
    const a = formatearNumero(f[est.colAltura]);
    return (
      '<tr>' +
        '<td>' + formatearHora(f[0]) + '</td>' +
        '<td class="' + (c === null ? 'vacio' : '') + '">' + (c === null ? '—' : c) + '</td>' +
        '<td class="' + (a === null ? 'vacio' : '') + '">' + (a === null ? '—' : a) + '</td>' +
      '</tr>'
    );
  }).join('');
}

function cerrarModal() {
  document.getElementById('modal').hidden = true;
}

async function cargarDatos() {
  try {
    const res = await fetch(CONFIG.URL_SCRIPT + '?horas=3');
    const json = await res.json();
    ultimosDatos = json;
    estaciones = parseEstaciones(json.encabezados);
    renderTarjetas();
  } catch (err) {
    document.getElementById('grid').innerHTML =
      '<p class="mensaje">No se pudo conectar con la planilla. Reintentando en unos minutos…</p>';
    console.error(err);
  }
}

document.getElementById('modalCerrar').addEventListener('click', cerrarModal);
document.getElementById('modal').addEventListener('click', function (e) {
  if (e.target.id === 'modal') cerrarModal();
});

cargarDatos();
setInterval(cargarDatos, CONFIG.REFRESCAR_CADA_MS);
</script>

</body>
</html>
